name: DevLens Automated Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish GitHub Release
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version from manifest.json
        id: get_version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('extension/manifest.json'))['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Run Tests
        run: |
          cd backend
          pip install -r requirements.txt
          pytest tests/

      - name: Package Extension (.zip)
        run: |
          mkdir -p dist
          cd extension
          zip -r ../dist/devlens-v${{ steps.get_version.outputs.VERSION }}.zip . -x "*.git*"
          cd ..

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### DevLens v${{ steps.get_version.outputs.VERSION }} Production Release
          Privacy-first Chromium extension & local analysis engine for runtime diagnostics.

          #### Features:
          - Real-time JavaScript runtime error triage and deduplication.
          - Failed API and HTTP status code inspection.
          - Language-aware stack trace parser (JS & Python).
          - GitHub repository health auditor with zero-setup browser engine.
          - 1-click Markdown (.md) and JSON export for PRs and issues.

          #### Quick Installation:
          1. Download `devlens-v${{ steps.get_version.outputs.VERSION }}.zip` below.
          2. Extract the `.zip` archive.
          3. Open Chrome/Brave/Edge to `chrome://extensions` and enable **Developer mode**.
          4. Click **Load unpacked** and select the extracted folder.
          EOF
          
          # Delete existing release/tag if already exists for this version so it overwrites cleanly
          gh release delete "${{ steps.get_version.outputs.TAG_NAME }}" --yes || true
          
          # Create and upload new release
          gh release create "${{ steps.get_version.outputs.TAG_NAME }}" \
            --title "DevLens v${{ steps.get_version.outputs.VERSION }} - Production Diagnostics Engine" \
            --notes-file release_notes.md \
            "dist/devlens-v${{ steps.get_version.outputs.VERSION }}.zip"
